<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - NAAP Lost & Found</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1e293b;
        }
        .offline-container {
            text-align: center;
            padding: 3rem 2rem;
            max-width: 400px;
        }
        .offline-icon {
            width: 120px;
            height: 120px;
            background: rgba(0,65,199,0.08);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            font-size: 3rem;
            color: #0041C7;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }
        h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
        p { color: #64748b; line-height: 1.6; margin-bottom: 2rem; }
        .retry-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.875rem 2rem;
            background: #0041C7;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(0,65,199,0.3);
        }
        .retry-btn:hover {
            background: #0033a8;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,65,199,0.4);
        }
        .features {
            margin-top: 2.5rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
        }
        .feature-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.375rem;
            padding: 1rem;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            min-width: 100px;
        }
        .feature-item i { font-size: 1.25rem; color: #0041C7; }
        .feature-item span { font-size: 0.75rem; color: #64748b; }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">
            <i class="bi bi-wifi-off"></i>
        </div>
        <h1>You're Offline</h1>
        <p>It looks like you've lost your internet connection. Don't worry - you can still view some cached content.</p>
        <button class="retry-btn" onclick="window.location.reload()">
            <i class="bi bi-arrow-clockwise"></i> Try Again
        </button>
        <div class="features">
            <div class="feature-item">
                <i class="bi bi-file-earmark-text"></i>
                <span>View Reports</span>
            </div>
            <div class="feature-item">
                <i class="bi bi-bookmark"></i>
                <span>Bookmarks</span>
            </div>
            <div class="feature-item">
                <i class="bi bi-gear"></i>
                <span>Settings</span>
            </div>
        </div>
    </div>
</body>
</html>
